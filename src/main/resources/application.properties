spring.application.name=valenciabank-api

# --- Base de datos (MySQL por Docker) ---
# Usuario/clave vienen de variables de entorno; si no existen, usa valores de DEV.
# Los secretos reales (produccion) iran por variables de entorno en el Bloque 10.
spring.datasource.url=jdbc:mysql://localhost:3306/valenciabank
spring.datasource.username=${DB_USERNAME:valenciabank}
spring.datasource.password=${DB_PASSWORD:valenciabank_dev}

# --- JPA / Hibernate ---
# ddl-auto=update: en DESARROLLO deja que Hibernate ajuste las tablas segun las entidades.
# En produccion esto se pone en 'validate' y los cambios van por migraciones (Flyway).
spring.jpa.hibernate.ddl-auto=update
# Ver el SQL que genera Hibernate (util para aprender; se apaga en produccion).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# Clave secreta para firmar los tokens. En DEV va aqui; en produccion, por variable de entorno.
# Debe tener al menos 32 caracteres (256 bits) para el algoritmo HS256.
jwt.secret=${JWT_SECRET:clave-de-desarrollo-valenciabank-cambiar-en-produccion-2026}
# Validez del token en milisegundos (86400000 = 24 horas).
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
